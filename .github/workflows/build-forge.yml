name: Build Forge mod
on:
  push:
    paths: ['forge-1.20.1/**', '.github/workflows/build-forge.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.1.1' }
      - name: Build
        working-directory: forge-1.20.1
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: randomhammers-1.20.1
          path: forge-1.20.1/build/libs/*.jar
      - name: Commit jar to the jar/ folder
        run: |
          mkdir -p jar
          cp forge-1.20.1/build/libs/randomhammers-1.20.1-*.jar jar/
          rm -f jar/*-sources.jar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jar
          git diff --cached --quiet || git commit -m "Build Forge jar [skip ci]"
          git push
